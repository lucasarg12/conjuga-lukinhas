   COLOUR/TYPE: sumi escuro, papel claro, vermelho-shu; Dela Gothic One + Zen Kaku Gothic New
   LAYOUT: carta no centro, ao vivo ao lado (empilha no celular) */
:root{--bg:#16151a;--bg2:#1e1c23;--panel:#24222b;--line:#38353f;--ink:#f3f0ea;--mute:#a7a3ae;--paper:#fbf8f1;--sumi:#1b1a1f;

html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif}
body{min-height:100vh;overflow-x:clip;background:

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 20px;min-height:44px;font-weight:700;background:var(--panel);border:1px solid var(--line)}
button.main{background:var(--shu);border-color:var(--shu);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pol);outline-offset:2px}
input[type=text],input[type=number],select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;width:100%}
label{cursor:pointer}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:22px}
.brand{font-family:"Dela Gothic One";font-size:22px;display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;width:40px;height:40px;background:var(--shu);border-radius:10px;color:#fff;font-size:22px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mute);white-space:nowrap}

h1{font-family:"Dela Gothic One";font-weight:400;font-size:clamp(32px,5vw,52px);line-height:1.05;margin:0 0 14px;text-wrap:balance}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:700}
.mute{color:var(--mute)}.small{font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.stackc{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.home .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:28px;align-items:center;margin-bottom:28px}
/* card */
.fuda{position:relative;background:var(--paper);color:var(--sumi);border-radius:20px;padding:26px 22px 20px;text-align:center;
 box-shadow:0 1px 0 #fff inset,0 18px 40px -18px #000,0 0 0 6px var(--paper),0 0 0 8px var(--shu);margin:8px auto;max-width:360px;width:100%}
.fuda .w{font-size:clamp(52px,10vw,84px);line-height:1.15;font-weight:700;letter-spacing:.02em}
.fuda rt{font-size:.3em;font-weight:500;color:#5b5862}
.fuda .m{font-size:17px;color:#55525c;margin-top:4px}
.fuda .k{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;background:#ece6da;color:#5b5862}
.fuda.tilt{transform:rotate(-3deg)}
.form{text-align:center;margin:22px 0 10px}
.form .fn{font-family:"Dela Gothic One";font-size:clamp(24px,4vw,34px);line-height:1.1}
.form .fj{color:var(--mute);font-size:16px;margin-top:4px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px;border:2px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.past{border-color:var(--past);color:var(--past)}.chip.neg{border-color:var(--neg);color:var(--neg)}.chip.pol{border-color:var(--pol);color:var(--pol)}
.chip.on.past{background:var(--past);color:#0d1626}.chip.on.neg{background:var(--neg);color:#2a0c10}.chip.on.pol{background:var(--pol);color:#2a1f05}
.ansbox{max-width:520px;margin:18px auto 0}
.ansbox input{font-size:26px;text-align:center;padding:14px;border-radius:16px;border-width:2px}
.hint{text-align:center;font-size:13px;color:var(--mute);margin-top:8px}
.fb{max-width:520px;margin:18px auto 0;border-radius:16px;padding:14px 18px;text-align:center;font-size:20px}
.fb.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);border:2px solid var(--ok)}
.fb.ng{background:color-mix(in srgb,var(--ng) 16%,transparent);border:2px solid var(--ng)}
.fb .yours{text-decoration:line-through;opacity:.75}
.fb .right{font-size:28px;font-weight:700}
.fb .alt{font-size:14px;color:var(--mute);margin-top:4px}
.timer{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--shu);width:100%;transition:width .2s linear}

.live h2{display:flex;justify-content:space-between;align-items:baseline}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.plist li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li.ok{border-color:var(--ok)}.plist li.ng{border-color:var(--ng)}
.plist li .s{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--line)}
.ok .mark{background:var(--ok);color:#06240f}.ng .mark{background:var(--ng);color:#2a0c10}
.me{color:var(--pol)}
.code{font-family:"Dela Gothic One";font-size:clamp(48px,9vw,84px);letter-spacing:.08em;line-height:1;color:var(--paper)}

.opts input{width:18px;height:18px;accent-color:var(--shu);flex:none}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}

.err{color:var(--ng);font-size:14px;min-height:1em}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
code{background:var(--bg2);padding:1px 6px;border-radius:6px;font-size:13px;overflow-wrap:anywhere}
pre{background:var(--bg2);padding:10px;border-radius:10px;font-size:12px;overflow-x:auto}
.big-ans{font-size:clamp(28px,5vw,40px);font-weight:700}

.padtog{display:flex;justify-content:center;gap:8px;margin-top:10px}
.padtog button{padding:6px 14px;min-height:38px;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:420px;margin:10px auto 0}
.pad button{padding:0;min-height:42px;font-size:20px;font-weight:500;border-radius:10px;background:var(--bg2)}
.pad button.fx{font-size:22px;font-weight:700;background:var(--panel)}
.pad button.go{grid-column:span 5;background:var(--shu);border-color:var(--shu);color:#fff;font-size:17px}
.pad i{display:block}

.capy{display:block;flex:none;overflow:visible}

@keyframes shake{20%{transform:translateX(-5px) rotate(-6deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.plist li .capy{margin:-6px 0}
.mood{font-size:12px;color:var(--mute);white-space:nowrap}
.mycapy{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mycapy b{display:block;font-size:17px}
.zoo{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.zoo li{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.zoo li.ok{border-color:var(--ok)}.zoo li.ng{border-color:var(--ng)}

.zoo .s{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute)}
.game.proj{grid-template-columns:minmax(0,1fr) minmax(0,460px)}

function toKana(src,final){const s=src.toLowerCase();let out='',i=0;
  while(i<s.length){const c=s[i];
    if(!/[a-z'\-]/.test(c)){out+=c;i++;continue}
    if(c==='-'){out+='ー';i++;continue}
    if(c==="'"){i++;continue}
    const n1=s[i+1];
    if(c==='n'){
      if(n1==="'"){out+='ん';i+=2;continue}
      if(n1==='n'){if(/[aiueoy]/.test(s[i+2]||'')){out+='ん';i++;}else{out+='ん';i+=2;}continue}
      if(n1&&/[bcdfghjkmpqrstvwxz]/.test(n1)){out+='ん';i++;continue}
      if(n1===undefined){out+=final?'ん':'n';i++;continue}
    }
    if(/[bcdfghjkmpqrstvwxyz]/.test(c)&&n1===c){out+='っ';i++;continue}
    let hit=false;
    for(let L=4;L>=1;L--){const sub=s.substr(i,L);if(sub.length===L&&RK[sub]){out+=RK[sub];i+=L;hit=true;break}}
    if(hit)continue;
    const rest=s.slice(i);
    if(!final&&RKP.has(rest)){out+=rest;break}
    out+=c;i++;
  }
  return out;}

      else if(closed){x.streak=0;if(x.seen)x.hp=Math.max(0,x.hp-10)}}}
  Object.values(R).forEach(x=>x.lv=x.hp>=90?5:x.hp>=70?4:x.hp>=45?3:x.hp>=25?2:x.hp>0?1:0);
  return Object.values(R).sort((a,b)=>b.score-a.score||b.ok-a.ok);}
function capyAnim(id,lv){const p=S.prevLv[id];S.prevLv[id]=lv;return p===undefined||p===lv?'':lv>p?'up':'down';}

const errMsg=e=>{const m=(e&&(e.message||e.code))||String(e);return /permission|denied/i.test(m)?'O Firebase recusou o acesso: confira se as Regras do Realtime Database foram publicadas.':m};
async function connect(code,online){
  if(S.net&&S.net.stop)S.net.stop();S.net=null;S.data={};
  const net=online?new FireNet():new LocalNet();
  await net.init(code,S.fbcfg);
  await new Promise((ok,no)=>{let first=true;const t=setTimeout(()=>no(new Error('O servidor não respondeu. Confira a internet e tente de novo.')),12000);
    net.on(d=>{S.data=d||{};if(first){first=false;clearTimeout(t);ok()}else render()},e=>{clearTimeout(t);no(e)})});
  S.net=net;S.code=code;
}
function disconnect(){if(S.net&&S.net.stop)S.net.stop();S.net=null;S.data={};S.role=null;}
async function hostCreate(mode){
  if(S.busy)return;S.busy=true;
  try{
    const code=Array.from({length:4},()=>'ACDEFGHJKLMNPQRTUVWXYZ'[Math.random()*22|0]).join('');
    await connect(code,mode==='online');
    S.role='host';
    await S.net.set('',null).catch(()=>{});
    await S.net.set('state',{phase:'lobby',round:0,total:S.cfg.rounds,opts:{furi:S.cfg.furi,meaning:S.cfg.meaning}});
    if(mode==='solo'){S.hostPlays=true;await joinAs(S.name||'Eu');}
    location.hash='host-'+code;
    S.busy=false;render(true);
  }catch(e){disconnect();S.busy=false;toast(errMsg(e))}
}
async function joinAs(name){S.name=name;ls.set('conjuga-name',name);
  await S.net.set('players/'+pid,{name:name.slice(0,24),on:true,t:S.net.now()});S.net.online('players/'+pid+'/on');}
async function playerJoin(code,name){
  if(S.busy)return;S.busy=true;
  try{code=code.toUpperCase().replace(/[^A-Z]/g,'');if(code.length!==4)throw new Error('O código tem 4 letras.');
    if(!name.trim())throw new Error('Digite seu nome.');
    await connect(code,!!S.fbcfg);
    if(!S.data.state){throw new Error(S.fbcfg?'Sala '+code+' não encontrada. Confira o código (ou se o professor já criou a sala).':'Sala não encontrada. Sem a config do Firebase, só dá para entrar em salas abertas neste mesmo navegador — use o link/QR do professor.')}
    S.role='player';await joinAs(name.trim());
    S.busy=false;render(true);
  }catch(e){disconnect();S.busy=false;toast(errMsg(e))}
}

async function startGame(){
  const c=S.cfg;if(!poolOK(c).length){toast('Nenhuma combinação possível: confira formas, tipos de palavra e níveis.');return}
  ls.set('conjuga-cfg',c);
  if(S.hostPlays&&!(S.data.players||{})[pid])await joinAs(S.name||'Professor');
  await S.net.set('answers',null);
  await S.net.set('state',{phase:'lobby',round:0,total:c.rounds,opts:{furi:c.furi,meaning:c.meaning}});
  nextRound();
}
function nextRound(){const s=st(),c=S.cfg;const r=(s.round||0)+1;
  const srs=(s.srs||[]).slice();let total=s.total||c.rounds,extra=s.extra||0,q=null;
  if(r>total){if(c.srs&&srs.length&&extra<5){q=srs.shift().q;total++;extra++}else{S.net.set('state',Object.assign({},s,{phase:'end'}));return}}
  else{const i=srs.findIndex(x=>x.due<=r);if(i>=0)q=srs.splice(i,1)[0].q}
  if(!q)q=genQ(c,s.q);const now=S.net.now();
  S.net.set('state',{phase:'question',round:r,total,extra,q,srs,hard:s.hard||[],start:now,deadline:now+c.secs*1000,opts:{furi:c.furi,meaning:c.meaning}});}
function reveal(){const s=st();if(s.phase!=='question')return;
  const ar=(S.data.answers||{})['r'+s.round]||{};const part=players().filter(p=>p.on||ar[p.id]);
  const wrong=part.filter(p=>!(ar[p.id]&&ar[p.id].ok)).length;const pct=part.length?Math.round(100*wrong/part.length):0;
  const srs=(s.srs||[]).slice(),hard=(s.hard||[]).slice();
  if(S.cfg.srs&&part.length&&pct>=S.cfg.srsPct){const rv=s.q.rv||0;
    if(rv<2)srs.push({q:Object.assign({},s.q,{rv:rv+1,pct}),due:s.round+2+rv*2});
    const k=qkey(s.q),h=hard.find(x=>qkey(x.q)===k);if(h)h.pct=Math.max(h.pct,pct);else hard.push({q:{w:s.q.w,f:s.q.f,d:s.q.d},pct});}
  S.net.set('state',Object.assign({},s,{phase:'reveal',revealedAt:S.net.now(),pct,srs,hard}));}
setInterval(()=>{
  if(S.role!=='host'||!S.net)return;const s=st(),now=S.net.now();
  if(s.phase==='question'){const ar=(S.data.answers||{})['r'+s.round]||{};const on=players().filter(p=>p.on);
    if((now>=s.deadline||(on.length&&on.every(p=>ar[p.id])))&&S.revealing!==s.round){S.revealing=s.round;reveal();}}
  if(s.phase==='reveal'&&S.cfg.auto&&now-(s.revealedAt||now)>6000&&S.advanced!==s.round){S.advanced=s.round;nextRound();}
},200);

function submit(){const s=st();if(s.phase!=='question')return;const r=s.round;if(S.mine[r])return;
  const inp=$('#ans');if(!inp)return;const txt=toKana(inp.value,true).trim();if(!txt)return;
  const now=S.net.now();const ok=check(s.q,txt);
  const pts=ok?100+Math.round(50*Math.max(0,s.deadline-now)/Math.max(1,s.deadline-s.start)):0;
  S.mine[r]={a:txt,ok,pts};
  S.net.set('answers/r'+r+'/'+pid,{a:txt.slice(0,40),ok,pts,t:now});
  render(true);
}

const DK1='かきくけこさしすせそたちつてとはひふへほう',DK2='がぎぐげござじずぜぞだぢづでどばびぶべぼゔ',HD1='はひふへほ',HD2='ぱぴぷぺぽ',SM1='あいうえおつやゆよわ',SM2='ぁぃぅぇぉっゃゅょゎ';
function padKey(x){const a=$('#ans');if(!a)return;let v=toKana(a.value,true);const last=v.slice(-1),body=v.slice(0,-1);
  const swap=(A,B)=>{let i=A.indexOf(last);if(i>=0)return body+B[i];i=B.indexOf(last);if(i>=0)return body+A[i];return v};
  if(x==='dk'){const i=HD2.indexOf(last);v=i>=0?body+DK2[DK1.indexOf(HD1[i])]:swap(DK1,DK2)}
  else if(x==='hd'){const i=DK2.indexOf(last);const base=i>=0?DK1[i]:last;const j=HD1.indexOf(base);v=j>=0?body+HD2[j]:(HD2.includes(last)?body+HD1[HD2.indexOf(last)]:v)}
  else if(x==='sm')v=swap(SM1,SM2);else if(x==='bs')v=v.slice(0,-1);else if(x==='go'){submit();return}

  return`<div class="top"><div class="brand"><span class="logo">活</span>Rodada ${s.round}/${s.total}${s.round>s.total-(s.extra||0)?' · revisão':''}</div><span class="pill">Sala <b>${S.code}</b></span></div>
  <div class="timer"><i id="tbar"></i></div><div class="small mute" style="text-align:right;margin-top:4px" id="tnum"></div>
  <div class="game ${zoo?'proj':''}"><section>${q.rv?`<span class="rev">Revisão · ${q.pct}% erraram antes</span>`:''}${card(q,furi,s.opts.meaning)}${formBlock(q)}<div id="mid">${mid}</div></section>
   <aside class="panel live">${plays?'<div class="mycapy" id="mycapy"></div>':''}<h2>${zoo?'Capivaras':'Placar'} <span class="small mute" id="pcount"></span></h2><ul class="${zoo?'zoo':'plist'}" id="live"></ul></aside></div>
  ${host?`<div class="hostbar">${s.phase==='question'?'<button id="brev">Revelar agora</button>':'<button class="main" id="bnext">'+(s.round>=s.total?((s.srs||[]).length&&S.cfg.srs&&(s.extra||0)<5?'Rodada de revisão ⏎':'Ver resultado final'):'Próxima ⏎')+'</button>'}<button id="bend">Encerrar</button></div>`:''}`;}

function viewEnd(){const rk=ranking(),s=st(),host=S.role==='host';const top=[rk[0],rk[1],rk[2]];const H=(s.hard||[]).slice().sort((a,b)=>b.pct-a.pct);
  const ch={past:['','Passado'],neg:['','Negativo'],pol:['Informal','Formal']};
  return`<div class="top"><div class="brand"><span class="logo">活</span>Resultado final</div><span class="pill">${s.total} rodadas · sala <b>${S.code}</b></span></div>
  <h1 style="text-align:center">${rk[0]?esc(rk[0].name)+' venceu!':'Fim de jogo'}</h1>
  <div class="podium">${top.map((p,i)=>p?`<div class="p${i+1} pop">${capy(p.lv,80).replace('class="capy','style="margin:0 auto" class="capy')}<div class="pos">${i+1}º</div><div class="nm">${esc(p.name)}</div><div class="sc">${p.score}</div><div class="small mute">${p.ok}/${s.total} acertos</div></div>`:`<div class="p${i+1}" style="opacity:.3"></div>`).join('')}</div>
  <section class="panel"><table><thead><tr><th>#</th><th>Nome</th><th>Capivara</th><th class="r">Pontos</th><th class="r">Acertos</th><th class="r">Melhor sequência</th></tr></thead>
  <tbody>${rk.map((p,i)=>`<tr><td>${i+1}</td><td class="${p.id===pid?'me':''}">${esc(p.name)}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${capy(p.lv,40)}<span class="small">${MOOD[p.lv]}</span></div></td><td class="r">${p.score}</td><td class="r">${p.ok}/${s.total}</td><td class="r">${p.best}</td></tr>`).join('')}</tbody></table></section>
  ${H.length?`<section class="panel" style="margin-top:20px"><h2>Para revisar: o que mais gente errou</h2><ul class="hard">${H.map(h=>{const w=WORDS[h.q.w],F=FORMS[h.q.f],a=answers(h.q);
    const tags=F.dims.map(k=>ch[k][h.q.d[k]?1:0]).filter(Boolean).join(' · ');
    return`<li><div class="hw">${esc(w.kanji)} <span class="small mute">${esc(w.pt)}</span></div><div class="small mute">${F.name}${tags?' · '+tags:''}</div><div class="ha">${esc(a.kanji[0])}${a.kanji[0]!==a.kana[0]?` <span class="small mute">${esc(a.kana[0])}</span>`:''}</div><div class="small" style="color:var(--ng)">${h.pct}% erraram</div></li>`}).join('')}</ul></section>`:''}
  ${host?'<div class="hostbar"><button class="main" id="bagain">Jogar de novo (mesma sala)</button><button id="blobby">Mudar configurações</button></div>':'<p class="hint">Espere o professor começar outra partida.</p>'}`;}

function screenKey(){if(!S.role)return'home';const s=st();if(S.role==='player'&&!(S.data.players||{})[pid])return'kicked';
  if(!s.phase||s.phase==='lobby')return S.role+'-lobby';if(s.phase==='end')return'end';return['game',s.phase,s.round,!!S.mine[s.round]||!!(((S.data.answers||{})['r'+s.round]||{})[pid])].join('|');}

function render(force){const k=screenKey();
  if(k!==S.key||force){S.key=k;
    if(k==='home')app.innerHTML=viewHome();
    else if(k==='host-lobby')app.innerHTML=viewLobby();
    else if(k==='player-lobby')app.innerHTML=`<div class="top"><div class="brand"><span class="logo">活</span>Conjuga!</div><span class="pill">Sala <b>${S.code}</b></span></div><div style="text-align:center;margin-top:6vh"><h1>Você está dentro, ${esc(S.name)}!</h1><p class="mute">Esperando o professor começar…</p><div style="display:grid;place-items:center">${capy(3,170)}<div class="mute small">Sua capivara. Acerte para ela ficar feliz; erre e ela apanha.</div></div><h2 style="margin-top:30px">Na sala</h2><ul class="plist" id="lob" style="max-width:420px;margin:0 auto"></ul></div>`;
    else if(k==='kicked'){app.innerHTML=`<div class="panel" style="max-width:480px;margin:10vh auto;text-align:center"><h2>Conexão perdida</h2><button class="main" id="brejoin">Entrar de novo</button></div>`;}
    else if(k==='end')app.innerHTML=viewEnd();
    else app.innerHTML=viewGame();
    bind(k);}
  dyn();}
function dyn(){const s=st();
  const lob=$('#lob');if(lob){const h=players().map(p=>`<li>${capy(3,46)}<span class="n ${p.id===pid?'me':''}">${esc(p.name)}</span></li>`).join('');if(lob.dataset.h!==h){lob.innerHTML=h;lob.dataset.h=h}}
  if(S.key==='host-lobby'){const P=players();const ul=app.querySelector('.plist');const h=app.querySelector('h2 .mute');if(ul&&h&&h.textContent!==`(${P.length})`){S.key='';render();return}}
  const live=$('#live');if(live){if(!live.childElementCount)S.liveSig='';const h=liveList(s);if(h!==null)live.innerHTML=h;const ar=(S.data.answers||{})['r'+s.round]||{};const pc=$('#pcount');if(pc)pc.textContent=`${Object.keys(ar).length}/${players().length} responderam`;}
  const mc=$('#mycapy');if(mc){const me=ranking().find(p=>p.id===pid);const sig=me?me.lv+'|'+me.score:'';if(mc.dataset.sig!==sig){mc.dataset.sig=sig;mc.innerHTML=myCapy()}}
  tick();}
function tick(){const s=st();const b=$('#tbar'),n=$('#tnum');if(!b||!S.net)return;
  if(s.phase==='question'){const t=timerTxt(s);b.style.width=t.pct+'%';n.textContent=Math.ceil(t.left/1000)+' s';}else{b.style.width='0%';n.textContent='tempo encerrado';}}
setInterval(tick,200);

function bind(k){const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  if(k==='home'){on('#bjoin',()=>{toast('Conectando…');playerJoin($('#jcode').value,$('#jname').value)});
    ['#jcode','#jname'].forEach(id=>{const e=$(id);if(e)e.onkeydown=ev=>{if(ev.key==='Enter')playerJoin($('#jcode').value,$('#jname').value)}});
    on('#bonline',()=>hostCreate('online'));on('#blocal',()=>hostCreate('local'));on('#bsolo',()=>hostCreate('solo'));
    on('#bfb',()=>{try{S.fbcfg=parseCfg($('#fbtxt').value);ls.set('conjuga-fb',S.fbcfg);render(true)}catch(e){toast(e.message)}});
    on('#bfbx',()=>{S.fbcfg=null;ls.set('conjuga-fb',null);render(true)});
    const jc=$('#jcode');if(jc&&jc.value)$('#jname').focus();}
  if(k==='host-lobby'){bindSettings();on('#bstart',()=>{if(S.hostPlays){const n=($('#hname').value||'').trim();if(!n){toast('Digite seu nome para jogar.');return}S.name=n}startGame()});
    on('#bcopy',()=>{const t=joinURL();navigator.clipboard.writeText(t).then(()=>{$('#bcopy').textContent='Copiado!'},()=>{const r=document.createRange();r.selectNodeContents($('#jlink'));getSelection().removeAllRanges();getSelection().addRange(r)})});
    const hp=$('#hplay');if(hp)hp.onchange=()=>{S.hostPlays=hp.checked;$('#hname').hidden=!hp.checked;if(!hp.checked&&(S.data.players||{})[pid])S.net.set('players/'+pid,null)};
    drawQR();}
  if(k.startsWith('game')){const a=$('#ans');if(a){if(!S.pad||!matchMedia('(pointer:coarse)').matches)a.focus();
      a.addEventListener('input',e=>{if(!e.isComposing){const v=toKana(a.value,false);if(v!==a.value)a.value=v}showPrev()});
      a.addEventListener('compositionend',()=>setTimeout(()=>{a.value=toKana(a.value,false);showPrev()},0));
      on('#bpad',()=>{S.pad=!S.pad;ls.set('conjuga-pad',S.pad);const v=a.value;render(true);const b=$('#ans');if(b){b.value=v;showPrev()}});
      const pad=$('#pad');if(pad)pad.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c){const i=$('#ans');i.value=toKana(i.value,true)+b.dataset.c;showPrev()}else padKey(b.dataset.x)};
      a.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submit()}});}
    on('#brev',()=>{S.revealing=st().round;reveal()});on('#bnext',()=>nextRound());on('#bend',()=>S.net.set('state',Object.assign({},st(),{phase:'end'})));}
  if(k==='end'){on('#bagain',()=>{S.mine={};startGame()});on('#blobby',()=>{S.mine={};S.net.set('answers',null);S.net.set('state',{phase:'lobby',round:0,total:S.cfg.rounds,opts:{}})});}
  if(k==='kicked')on('#brejoin',()=>joinAs(S.name));}
document.addEventListener('keydown',e=>{if(S.role==='host'&&e.key==='Enter'&&st().phase==='reveal'&&!$('#ans')){e.preventDefault();nextRound()}});
function drawQR(){const el=$('#qr');if(!el)return;const go=()=>{try{el.innerHTML='';new QRCode(el,{text:joinURL(),width:150,height:150,correctLevel:QRCode.CorrectLevel.L})}catch(e){el.remove()}};
  if(window.QRCode)go();else loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').then(go,()=>el.remove());}

window.__conjuga={WORDS,FORMS,answers,check,toKana,norm,genQ,DEF};
render(true);
}
</script>
</body>
</html>
